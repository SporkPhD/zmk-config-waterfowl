# Left half (central): info screen.
# Lets the rollers scroll (&msc in waterfowl.keymap).
CONFIG_ZMK_POINTING=y

# Battery level of both halves on the left screen.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y

# Typing speed as a number instead of Bongo Cat (he lives on the right).
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# nice-oled's default positions are for a taller (160 px) screen, which left
# the layer name off the bottom. From the top of the 64x128 canvas:
# batteries (0), USB/Bluetooth (32), layer (52), typing speed (72), modifiers (96).
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=52
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_Y=72
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=96
