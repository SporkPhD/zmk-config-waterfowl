# Right half (peripheral): battery, link status and a Bongo Cat that taps along
# with the keys you press on this half (src/peripheral_bongo_cat.c).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n
CONFIG_WATERFOWL_PERIPHERAL_BONGO_CAT=y

# nice-oled always draws a crystal when its animations are off; move it off
# the screen so the cat has the middle to itself.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_X=200
# Centre the cat (its frame is 26x50 in the screen's unrotated pixels).
CONFIG_WATERFOWL_PERIPHERAL_BONGO_CAT_X=51
CONFIG_WATERFOWL_PERIPHERAL_BONGO_CAT_Y=7
