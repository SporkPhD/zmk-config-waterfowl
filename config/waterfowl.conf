# Rollers and dials
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED screens (both halves), drawn by nice-oled. The screens are 128x64 but
# mounted upright, so nice-oled draws on a 64x128 canvas and rotates it.
CONFIG_ZMK_DISPLAY=y
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=64
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128
# nice-oled turns this off by default; keep it on to save battery and avoid burn-in.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
