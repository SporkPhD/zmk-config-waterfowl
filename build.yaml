# Firmware builds run by GitHub Actions (see .github/workflows/build.yml).
# Only the left half (the central) gets ZMK Studio.
---
include:
  - board: nice_nano_v2
    shield: waterfowl_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: waterfowl_right nice_oled
  # Wipes saved settings (Bluetooth pairings and Studio edits). Only for troubleshooting.
  - board: nice_nano_v2
    shield: settings_reset
